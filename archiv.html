<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archiv – Budějovice a Prachatice</title><meta name="description" content="Denní přehled pro Budějovice a Prachatice: kultura, obytňák, nafta, AI.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml"><style>
:root{--bg:#edf1f0;--card:#fff;--fg:#13201f;--mut:#56645f;--line:#d6dfdc;--soft:#e4ebe9;--acc:#0d6a6e;--acc-ink:#fff;
--c1:#0d6a6e;--c2:#b26a10;--film:#7d4fa3;--div:#bf4329;--akce:#0d6a6e;--up:#bf4329;--down:#2c7a3f;--warn:#8a5a00}
@media (prefers-color-scheme:dark){:root{--bg:#0c1415;--card:#132022;--fg:#e3ebe9;--mut:#93a39f;--line:#243638;--soft:#1a2b2d;--acc:#4cb8b3;--acc-ink:#062022;
--c1:#4cb8b3;--c2:#e8a64a;--film:#c49ee3;--div:#f0896f;--akce:#4cb8b3;--up:#f0896f;--down:#7fd08f;--warn:#e8b04f;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Source Sans 3",system-ui,sans-serif}
main{max-width:1120px;margin:0 auto;padding:18px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 16px;padding:6px 0 4px}
.kicker{margin:0;font:600 .78rem/1 "Source Sans 3",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
header h1{font:700 clamp(1.6rem,4vw,2.3rem)/1.1 "Bricolage Grotesque",system-ui,sans-serif;margin:4px 0 0;text-wrap:balance;letter-spacing:-.01em}
header .v{margin:2px 0 0}nav{display:flex;gap:6px;margin-left:auto}nav a{color:var(--acc);text-decoration:none;font-weight:600;padding:6px 10px;border-radius:8px}nav a:hover{background:var(--soft)}
h2{font:700 1.12rem/1.25 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 4px;text-wrap:balance}
h3{font:600 .98rem/1.3 "Bricolage Grotesque",system-ui,sans-serif;margin:14px 0 4px}
a{color:inherit;text-decoration-color:var(--line);text-underline-offset:3px}a:hover{text-decoration-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;margin-top:16px;align-items:start}
.grid>section,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.card.wide{grid-column:1/-1}
.list,.plain{list-style:none;margin:6px 0 0;padding:0}
.ev{display:grid;grid-template-columns:3.1rem 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line)}.ev:first-child{border-top:0}
.ev .t{font-variant-numeric:tabular-nums;font-weight:700;position:relative;padding-left:12px}
.ev .t::before{content:"";position:absolute;left:0;top:.45em;width:7px;height:7px;border-radius:50%;background:var(--akce)}
.ev.k-film .t::before{background:var(--film)}.ev.k-divadlo .t::before{background:var(--div)}.m{min-width:0}
.v{color:var(--mut);font-size:.88rem}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--mut);margin:10px 0 0}
.legend span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--c)}
.plain li{padding:6px 0;border-top:1px solid var(--line)}.plain li:first-child{border-top:0}
.empty,.note{color:var(--mut);font-size:.86rem}.note{margin:10px 0 0}.warn{color:var(--warn)}
.news{border-left:4px solid var(--acc);padding:2px 0 2px 14px;margin-top:6px}.news h3{font-size:1.08rem;margin:0 0 4px}.news p{margin:4px 0}
.tw{overflow-x:auto}.agi{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;margin-top:4px}
.agi th,.agi td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}.agi th:first-child{text-align:left;font-weight:600;white-space:normal}
.agi thead th{font-weight:600;color:var(--mut);font-size:.82rem}.agi tbody tr:last-child>*{border-bottom:0}.d{font-size:.72rem;color:var(--mut);margin-left:3px}
details{margin-top:14px;color:var(--mut);font-size:.86rem}details li{margin:3px 0}summary{cursor:pointer}
footer{margin-top:28px;color:var(--mut);font-size:.8rem}
.big{font-size:1.3rem;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.weekend{margin-top:26px}.wk{margin:22px 0 0;font-size:1rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}.grid.tight{margin-top:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px;margin-top:16px}
.tile{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--fg);min-width:0}
.tile:hover{border-color:var(--acc)}.tile .lab{font-size:.75rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.tile b{font:700 1.45rem/1.15 "Bricolage Grotesque",system-ui,sans-serif;font-variant-numeric:tabular-nums}.tile .v{font-size:.86rem}
.tabs{position:sticky;top:0;z-index:3;display:flex;gap:4px;overflow-x:auto;margin:20px -16px 0;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{flex:none;font:600 .95rem/1 "Source Sans 3",system-ui,sans-serif;color:var(--mut);background:none;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
.tabs button:hover{color:var(--fg);background:var(--soft)}.tabs button[aria-selected="true"]{color:var(--acc-ink);background:var(--acc)}
.arch{list-style:none;padding:0}.arch li{padding:6px 0;border-bottom:1px solid var(--line)}.arch a{color:var(--acc)}
.eyebrow{margin:0;font-size:.76rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--acc)}
.trip .pick{font-size:clamp(1.5rem,4vw,2rem);margin:4px 0 2px}.trip .pick .v{font:400 .95rem "Source Sans 3",system-ui,sans-serif;white-space:nowrap}
.sum{margin:0 0 12px}
.wdays{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px}
.wday{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;background:var(--soft);border-radius:12px;padding:12px 14px}
.wday .ico{font-size:1.9rem;line-height:1}.wday b{display:block;text-transform:capitalize}.wday dl{grid-column:1/-1;display:flex;gap:16px;margin:4px 0 0}
.wday dt{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}.wday dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.btn{display:inline-block;padding:9px 14px;border-radius:10px;background:var(--acc);color:var(--acc-ink);text-decoration:none;font-weight:600}
.btn.ghost{background:none;color:var(--acc);border:1px solid var(--acc)}
.alt{margin:4px 0 0;padding-left:1.4em}.alt li{padding:5px 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px}
.alt li:first-child{border-top:0}.alt .sm{font-variant-numeric:tabular-nums;color:var(--mut);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:10px;margin:10px 0 6px}
.stats>div{background:var(--soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.stats .lab{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.stats b{font:700 1.35rem/1.2 "Bricolage Grotesque",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.chg.up{color:var(--up)}.chg.down{color:var(--down)}
.chart{margin:8px 0 0}.cw{position:relative}.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}.chart .tk{stroke:var(--mut)}.chart .ax{fill:var(--mut);font-size:11px;font-family:"Source Sans 3",system-ui,sans-serif}
.chart .el{fill:var(--fg);font-size:13px;font-weight:700;font-family:"Source Sans 3",system-ui,sans-serif}
.chart .xh{stroke:var(--mut);stroke-width:1;stroke-dasharray:3 3;opacity:0}.chart .xh.on{opacity:1}
.tip{position:absolute;top:0;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:.82rem;white-space:nowrap;box-shadow:0 4px 14px rgb(0 0 0/.12);font-variant-numeric:tabular-nums}
.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.dt{margin-top:6px}
.kid h2{font-size:1.35rem;margin:4px 0 8px}.kid p{margin:6px 0}.need{background:var(--soft);border-radius:10px;padding:8px 12px}.note.wide{grid-column:1/-1;margin:0}
.only-narrow{display:none}@media (max-width:600px){.only-wide{display:none}.only-narrow{display:block}}
.trip{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:8px 32px}.tripr h3{margin-top:4px}
.days3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:4px 24px}
.agi .sub{display:block;font-weight:400;font-size:.78rem}
@media (max-width:480px){.tile b{font-size:1.15rem}.tile{padding:12px}.agi th,.agi td{padding:5px 4px;font-size:.88rem}nav{margin-left:0}.grid>section,.card{padding:14px}}
</style></head><body><main><header><div><p class="kicker">Budějovice · Prachatice</p><h1>Archiv</h1><p class="v">starší denní přehledy</p></div><nav><a href="./">Dnes</a><a href="archiv.html">Archiv</a></nav></header><ul class="arch"><li><a href="den/2026-10-18.html">neděle 18. října 2026</a></li><li><a href="den/2026-10-17.html">sobota 17. října 2026</a></li><li><a href="den/2026-10-16.html">pátek 16. října 2026</a></li></ul></main></body></html>
